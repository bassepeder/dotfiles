font_family      family='JetBrainsMono Nerd Font Mono' style=Light variable_name=JetBrainsMonoNerdFontMono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13

hide_window_decorations titlebar-only
scrollback_indicator_opacity 0.5
background_opacity 0.9
background_blur 50
inactive_text_alpha 0.8
enabled_layouts splits:split_axis=auto;equalize_on_close=true

paste_actions no-op

tab_bar_style separator
tab_separator ""
tab_bar_min_tabs 2
# Colors and tab title templates live in {dark,light}-theme.auto.conf, which kitty swaps with macOS appearance.
active_tab_font_style bold
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map ctrl+t new_tab
map ctrl+w close_tab

copy_on_select yes
mouse_hide_wait 0.5
macos_quit_when_last_window_closed yes
repaint_delay 3
input_delay 1

map cmd+enter launch --location=split
map cmd+shift+enter launch --location=hsplit

map cmd+h neighboring_window left
map cmd+l neighboring_window right
map cmd+k neighboring_window up
map cmd+j neighboring_window down

map cmd+shift+left resize_window narrower 3
map cmd+shift+right resize_window wider 3
map cmd+shift+up resize_window taller 3
map cmd+shift+down resize_window shorter 3

map cmd+shift+e layout_action equalize

map cmd+option+up layout_action move_to_screen_edge top
map cmd+option+down layout_action move_to_screen_edge bottom
map cmd+option+left layout_action move_to_screen_edge left
map cmd+option+right layout_action move_to_screen_edge right

map cmd+shift+r layout_action rotate

map cmd+w close_window
