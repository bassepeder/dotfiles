# cmode: a plain, fixed-colour console for writing C (opened by scripts/cmode).
#
# Reuses the normal kitty.conf for keymaps and layouts, then overrides the
# look. There are no *.auto.conf files in this directory, so the colours stay
# put whatever macOS or `theme` does.
include ~/.config/kitty/kitty.conf
# the colour-blind-friendly Vivendi: yellow/blue where the default uses red/green
include ~/.config/kitty-cmode/modus-vivendi-deuteranopia.conf

# C64 Pro Mono (install.sh fetches it). Its PETSCII glyphs sit where Nerd Font
# icons live, so map that range back to the icons, and give its full-height
# glyphs room between lines. `cmode --terminus` swaps in Terminus.
font_family      family='C64 Pro Mono'
font_size        12
symbol_map       U+E000-U+F8FF Symbols Nerd Font Mono
modify_font      cell_height 125%
background_opacity 1
background_blur    0
inactive_text_alpha 1
cursor_shape          block
cursor_blink_interval 0

# .zshrc switches to a bare prompt, plain tools and nvim-c when this is set
env CMODE=1
